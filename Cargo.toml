[package]
name = "tower4"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
tungstenite = { version = "0.24", features = ["native-tls"] }


[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["minwindef", "mmreg", "mmeapi", "mmsystem"] }